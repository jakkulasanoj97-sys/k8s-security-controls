apiVersion: v1
kind: ServiceAccount
metadata:
  name: hardened-app-sa
  namespace: workloads
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hardened-app-role
  namespace: workloads
rules:
  # Least privilege: read-only access to only the resources the app needs.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hardened-app-binding
  namespace: workloads
subjects:
  - kind: ServiceAccount
    name: hardened-app-sa
    namespace: workloads
roleRef:
  kind: Role
  name: hardened-app-role
  apiGroup: rbac.authorization.k8s.io
