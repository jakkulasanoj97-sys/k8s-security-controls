name: K8s Security CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  policy-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Kyverno CLI
        run: |
          TAG=v1.13.4
          curl -sSL -o kyverno.tar.gz "https://github.com/kyverno/kyverno/releases/download/${TAG}/kyverno-cli_${TAG}_linux_x86_64.tar.gz"
          tar -xzf kyverno.tar.gz
          sudo mv kyverno /usr/local/bin/
          kyverno version

      - name: Run Kyverno policy tests
        run: kyverno test policies/kyverno/

      - name: Trivy manifest misconfiguration scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: manifests/
          severity: HIGH,CRITICAL
          exit-code: "0"   # report, don't fail build (insecure/ is intentional)
