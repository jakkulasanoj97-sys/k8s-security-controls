apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hardened-app-ingress
  namespace: workloads
spec:
  podSelector:
    matchLabels:
      app: hardened-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: frontend
      ports:
        - protocol: TCP
          port: 8080
